site_name: Isaías Vela
site_description: DevSecOps, Cloud Security and Kubernetes Security engineer portfolio.
site_author: Isaías Vela
site_url: https://isaiasvela.github.io/
repo_url: https://github.com/isaiasvela
repo_name: GitHub

theme:
  name: material
  custom_dir: overrides
  logo: images/logo/logo.ico
  favicon: images/logo/logo.ico
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: slate
      primary: black
      accent: red

plugins:
  - search
  - tags
  - blog:
      blog_dir: blog
      authors: false

extra_css:
  - stylesheets/styles.css

extra_javascript:
  - javascripts/goatcounter.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/isaiasvela
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/isa%C3%ADas-vela-sotil-b436431a4/

nav:
  - Home: index.md
  - CV: cv.md
  - Projects:
      - Overview: projects/index.md
      - Kubernetes Security Lab: projects/kubernetes-security-lab.md
      - GitHub Bootstrap: projects/github-bootstrap.md
      - TimeTrack: projects/timetrack.md
      - Weather Dashboard: projects/weather-dashboard.md
  - Research:
      - Overview: research/index.md
      - Writeups:
          - First Hacking: research/writeups/first-hacking.md
          - Injection: research/writeups/injection.md
          - Trust: research/writeups/trust.md
          - Obsession: research/writeups/obsession.md
  - Blog: blog/index.md
  - Tags: tags.md
